
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARD Browser</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  font-family: Arial, sans-serif;
  background: #17191f;
  color: white;
}

header {
  background: #222630;
  padding: 13px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.logo {
  font-size: 20px;
  font-weight: bold;
}

#status {
  font-size: 12px;
  color: #aaa;
}

#connect {
  margin-left: auto;
}

button {
  background: #426be8;
  color: white;
  border: 0;
  padding: 9px 14px;
  border-radius: 6px;
  cursor: pointer;
}

button:hover { background: #5880ff; }
button:disabled { opacity: .4; cursor: not-allowed; }

#tabs {
  display: flex;
  align-items: end;
  overflow-x: auto;
  min-height: 45px;
  padding: 5px 5px 0;
  gap: 4px;
}

.tab {
  background: #292d37;
  padding: 12px;
  border-radius: 8px 8px 0 0;
  min-width: 100px;
  max-width: 190px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  color: #bbb;
  white-space: nowrap;
}

.tab.active {
  background: #353b49;
  color: white;
}

.close {
  color: #aaa;
  font-size: 18px;
}

.close:hover { color: red; }

#add {
  margin: 5px;
  font-size: 20px;
  padding: 4px 12px;
}

#content {
  flex: 1;
  min-height: 0;
  position: relative;
  background: white;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: none;
  background: white;
}

iframe.active { display: block; }

#start, #error {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px;
}

#start {
  background: #f2f3f7;
  color: #333;
}

#start p { color: #777; }

#error {
  background: #20232c;
  color: white;
}

.hidden { display: none !important; }

@media(max-width:500px) {
  #connect { margin-left: 0; }
}
</style>
</head>

<body>

<header>
  <div class="logo">🌐 CARD Browser</div>
  <div id="status">Nincs CARD csatlakoztatva</div>
  <button id="connect">CARD kiválasztása</button>
</header>

<div id="tabs">
  <button id="add" disabled>+</button>
</div>

<div id="content">

  <div id="start">
    <h1>🌐 CARD Browser</h1>
    <p>Csatlakoztasd a CARD nevű SD-kártyát!</p>
    <button onclick="connectCard()">Csatlakoztatás</button>
  </div>

  <div id="error" class="hidden">
    <h2>⚠️ CARD nem található!</h2>
    <p>Válaszd ki a CARD nevű SD-kártya mappáját!</p>
    <button onclick="connectCard()">Újrapróbálás</button>
  </div>

</div>

<script>
"use strict";

let directory = null;
let tabs = [];
let activeTab = null;
let firefoxFiles = new Map();
let cardReady = false;

const tabBar = document.getElementById("tabs");
const content = document.getElementById("content");
const addButton = document.getElementById("add");
const statusText = document.getElementById("status");

function showError(message = "CARD nem található!") {
  cardReady = false;
  directory = null;
  firefoxFiles.clear();
  closeAll();

  document.getElementById("start").classList.add("hidden");

  const error = document.getElementById("error");
  error.classList.remove("hidden");
  error.querySelector("p").textContent = message;

  statusText.textContent = "Nincs CARD";
  addButton.disabled = true;
}

function enableBrowser() {
  cardReady = true;

  document.getElementById("start").classList.add("hidden");
  document.getElementById("error").classList.add("hidden");

  statusText.textContent = "● CARD csatlakoztatva";
  addButton.disabled = false;
}

function showEmpty() {
  document.getElementById("start").classList.remove("hidden");
  document.getElementById("error").classList.add("hidden");

  document.getElementById("start").innerHTML =
    "<h1>📂 CARD</h1><p>Nem található megnyitható HTML-fájl.</p>";
}

// CARD CSATLAKOZTATÁSA
async function connectCard() {

  // CHROME / EDGE
  if (typeof window.showDirectoryPicker === "function") {

    try {
      const handle = await window.showDirectoryPicker();

      if (handle.name.toUpperCase() !== "CARD") {
        showError("A kiválasztott mappa neve nem CARD!");
        return;
      }

      directory = handle;
      firefoxFiles.clear();

      enableBrowser();

      await loadDirectory();
      return;

    } catch (error) {
      if (error.name !== "AbortError") {
        showError("Nem sikerült megnyitni a mappát.");
      }
      return;
    }
  }

  // FIREFOX
  const picker = document.createElement("input");

  picker.type = "file";
  picker.multiple = true;
  picker.setAttribute("webkitdirectory", "");

  picker.onchange = async function() {

    const files = Array.from(picker.files);

    if (!files.length) {
      showError("Nem választottál ki fájlokat.");
      return;
    }

    // A mappa nevét a relatív útvonalból olvassuk.
    const paths = files
      .map(file => file.webkitRelativePath)
      .filter(path => path && path.includes("/"));

    if (!paths.length) {
      showError(
        "A Firefox nem adott mappaútvonalat. " +
        "Válaszd ki a CARD mappát mappaként, ne fájlként."
      );
      return;
    }

    const roots = new Set(
      paths.map(path => path.split("/")[0].toUpperCase())
    );

    if (roots.size !== 1 || !roots.has("CARD")) {
      showError("A kiválasztott mappa neve CARD legyen!");
      return;
    }

    firefoxFiles.clear();

    for (const file of files) {
      if (file.name.toLowerCase().endsWith(".html")) {
        firefoxFiles.set(file.name, file);
      }
    }

    directory = null;

    enableBrowser();
    closeAll();

    for (const [name, file] of firefoxFiles) {
      await openFile(name, file);
    }

    if (!tabs.length) showEmpty();
  };

  picker.click();
}

// CHROME / EDGE FÁJLOK BETÖLTÉSE
async function loadDirectory() {
  closeAll();

  try {
    for await (const [name, handle] of directory.entries()) {
      if (
        handle.kind === "file" &&
        name.toLowerCase().endsWith(".html")
      ) {
        await openFile(name, handle);
      }
    }

    if (!tabs.length) showEmpty();

  } catch (error) {
    showError("Nem sikerült olvasni a CARD tartalmát.");
  }
}

// HTML MEGNYITÁSA
async function openFile(name, handle) {

  if (!cardReady) return;

  const existing = tabs.find(tab => tab.name === name);

  if (existing) {
    activateTab(existing.id);
    return;
  }

  try {
    const file = handle instanceof File
      ? handle
      : await handle.getFile();

    const html = await file.text();

    const id = Date.now() + Math.random();

    const frame = document.createElement("iframe");

    frame.setAttribute(
      "sandbox",
      "allow-scripts allow-forms allow-modals"
    );

    frame.srcdoc = html;

    content.appendChild(frame);

    tabs.push({
      id,
      name,
      title: name.replace(/\.html$/i, ""),
      frame
    });

    document.getElementById("start").classList.add("hidden");

    activateTab(id);

  } catch (error) {
    alert("Hiba a fájl megnyitásakor: " + name);
  }
}

// LAPOK KIRAJZOLÁSA
function renderTabs() {

  document.querySelectorAll(".tab").forEach(tab => tab.remove());

  tabs.forEach(tab => {

    const element = document.createElement("div");

    element.className =
      "tab" + (tab.id === activeTab ? " active" : "");

    const title = document.createElement("span");
    title.textContent = tab.title;

    const close = document.createElement("span");
    close.className = "close";
    close.textContent = "×";

    close.onclick = event => {
      event.stopPropagation();
      closeTab(tab.id);
    };

    element.onclick = () => activateTab(tab.id);

    element.append(title, close);

    tabBar.insertBefore(element, addButton);
  });
}

// LAP AKTIVÁLÁSA
function activateTab(id) {

  activeTab = id;

  tabs.forEach(tab => {
    tab.frame.classList.toggle("active", tab.id === id);
  });

  renderTabs();
}

// LAP BEZÁRÁSA
function closeTab(id) {

  const index = tabs.findIndex(tab => tab.id === id);

  if (index === -1) return;

  tabs[index].frame.remove();
  tabs.splice(index, 1);

  if (tabs.length) {
    activeTab = tabs[Math.min(index, tabs.length - 1)].id;
    activateTab(activeTab);
  } else {
    activeTab = null;
    renderTabs();
    showEmpty();
  }
}

// ÖSSZES LAP BEZÁRÁSA
function closeAll() {

  tabs.forEach(tab => tab.frame.remove());

  tabs = [];
  activeTab = null;

  renderTabs();
}

// ÚJ HTML MEGNYITÁSA
addButton.onclick = async function() {

  if (!cardReady) {
    showError();
    return;
  }

  const picker = document.createElement("input");

  picker.type = "file";
  picker.accept = ".html";
  picker.multiple = true;

  picker.onchange = async function() {

    for (const file of picker.files) {
      await openFile(file.name, file);
    }
  };

  picker.click();
};

document.getElementById("connect").onclick = connectCard;

</script>

</body>
</html>
