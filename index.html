
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Browser</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  font-family: Arial, sans-serif;
  background: #17191f;
  color: white;
}

header {
  background: #222630;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.logo {
  font-size: 21px;
  font-weight: bold;
}

#status {
  color: #aaa;
  font-size: 12px;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 10px 15px;
  background: #426be8;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #5880ff;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

#connect {
  margin-left: auto;
}

.search-area {
  background: #252a35;
  padding: 12px;
  position: relative;
}

.search-row {
  display: flex;
  gap: 8px;
}

#search {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #414958;
  border-radius: 8px;
  background: #171b24;
  color: white;
  font-size: 16px;
  outline: none;
}

#search:focus {
  border-color: #5880ff;
}

#results {
  position: absolute;
  z-index: 10;
  top: calc(100% - 5px);
  left: 12px;
  right: 12px;
  background: #303644;
  border-radius: 8px;
  max-height: 260px;
  overflow-y: auto;
  box-shadow: 0 5px 15px #0008;
}

.result {
  padding: 13px;
  border-bottom: 1px solid #414958;
  cursor: pointer;
}

.result:hover {
  background: #414b61;
}

.result small {
  color: #aaa;
}

#tabs {
  display: flex;
  gap: 4px;
  align-items: end;
  min-height: 44px;
  overflow-x: auto;
  padding: 5px 5px 0;
  background: #17191f;
}

.tab {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 100px;
  max-width: 200px;
  padding: 12px;
  border-radius: 8px 8px 0 0;
  background: #292d37;
  color: #bbb;
  cursor: pointer;
  white-space: nowrap;
}

.tab.active {
  background: #353b49;
  color: white;
}

.close {
  color: #aaa;
  font-size: 18px;
}

.close:hover {
  color: red;
}

#content {
  flex: 1;
  min-height: 0;
  position: relative;
  background: white;
}

iframe {
  display: none;
  width: 100%;
  height: 100%;
  border: 0;
  background: white;
}

iframe.active {
  display: block;
}

#start, #error {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px;
}

#start {
  color: #333;
  background: #f2f3f7;
}

#start p {
  color: #777;
}

#error {
  background: #20232c;
}

.hidden {
  display: none !important;
}

@media(max-width:500px) {
  #connect {
    margin-left: 0;
  }

  .logo {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🌐 CARD Browser</div>
  <div id="status">Nincs kártya csatlakoztatva</div>
  <button id="connect">SD-kártya kiválasztása</button>
</header>

<div class="search-area">
  <div class="search-row">
    <input
      id="search"
      type="search"
      placeholder="🔍 Keresés"
      autocomplete="off"
      disabled
    >
    <button id="searchBtn" disabled>Megnyitás</button>
  </div>

  <div id="results" class="hidden"></div>
</div>

<div id="tabs"></div>

<div id="content">

  <div id="start">
    <h1>🌐 CARD Browser</h1>
    <p>Válasszon SD-kártyát</p>
    <button onclick="connectCard()">Kártya kiválasztása</button>
  </div>

  <div id="error" class="hidden">
    <h2>⚠️ Nincs CARD csatlakoztatva</h2>
    <p>Csatlakoztassa az SD-kártyát, majd próbálja újra!</p>
    <button onclick="connectCard()">Újrapróbálkozás</button>
  </div>

</div>

<script>
"use strict";

let directory = null;
let files = [];
let tabs = [];
let activeTab = null;
let connected = false;

const status = document.getElementById("status");
const search = document.getElementById("search");
const results = document.getElementById("results");
const tabsElement = document.getElementById("tabs");
const content = document.getElementById("content");

// FÁJLSZŰRŐ
function isValidHtml(name) {
  return (
    name.toLowerCase().endsWith(".html") &&
    !name.startsWith("._")
  );
}

// KÁRTYA KIVÁLASZTÁSA
async function connectCard() {

  // CHROME / EDGE
  if (typeof window.showDirectoryPicker === "function") {

    try {
      const handle = await window.showDirectoryPicker({
        mode: "read"
      });

      if (handle.name.toUpperCase() !== "CARD") {
        disconnect();
        alert("A kiválasztott kártya nem megfelelő");
        return;
      }

      directory = handle;
      files = [];

      for await (const [name, entry] of directory.entries()) {

        if (
          entry.kind === "file" &&
          isValidHtml(name)
        ) {
          files.push({
            name,
            handle: entry
          });
        }
      }

      connected = true;
      cardReady();

    } catch (e) {
      if (e.name !== "AbortError") {
        alert("Nem sikerült beolvasni a kártyát: " + e.message);
      }
    }

    return;
  }

  // FIREFOX
  const picker = document.createElement("input");

  picker.type = "file";
  picker.multiple = true;
  picker.setAttribute("webkitdirectory", "");

  picker.onchange = () => {

    const selected = Array.from(picker.files);

    if (!selected.length) {
      disconnect();
      return;
    }

    const paths = selected
      .map(f => f.webkitRelativePath)
      .filter(Boolean);

    if (!paths.length) {
      disconnect();
      alert(
        "A Firefox nem adott mappaútvonalat. " +
        "Próbálon friss Firefox-verziót használni."
      );
      return;
    }

    const roots = [...new Set(
      paths.map(path => path.split("/")[0].toUpperCase())
    )];

    if (roots.length !== 1 || roots[0] !== "CARD") {
      disconnect();
      alert("A kiválasztott kártya nem megfelelő");
      return;
    }

    files = [];

    // CSAK A CARD GYÖKÉRKÖNYVTÁRÁNAK HTML-FÁJLJAI
    // A ._ kezdetű fájlokat kihagyjuk.
    for (const file of selected) {

      const path = file.webkitRelativePath.split("/");

      if (
        path.length === 2 &&
        isValidHtml(file.name)
      ) {
        files.push({
          name: file.name,
          handle: file
        });
      }
    }

    directory = null;
    connected = true;

    cardReady();
  };

  picker.click();
}

// SIKERES CSATLAKOZTATÁS
function cardReady() {

  document.getElementById("start").classList.add("hidden");
  document.getElementById("error").classList.add("hidden");

  status.textContent =
    "● CARD csatlakoztatva – " + files.length + " HTML";

  search.disabled = false;
  search.placeholder = "🔍 Keresés";

  document.getElementById("searchBtn").disabled = false;

  search.value = "";

  renderResults();

  if (!files.length) {
    showStart("A kártya nem megfelelő.");
  } else {
    showStart(
      files.length +
      " HTML-fájl található a CARD kártyán."
    );
  }
}

// LECSATLAKOZTATÁS
function disconnect() {

  connected = false;
  directory = null;
  files = [];

  closeAll();

  search.value = "";
  search.disabled = true;
  search.placeholder = "Csatlakoztassa a CARD-ot!";

  document.getElementById("searchBtn").disabled = true;

  results.classList.add("hidden");

  status.textContent = "Nincs CARD";

  document.getElementById("start").classList.add("hidden");
  document.getElementById("error").classList.remove("hidden");
}

// KEZDŐOLDAL
function showStart(message) {

  document.getElementById("error").classList.add("hidden");

  const start = document.getElementById("start");

  start.classList.remove("hidden");

  const heading = document.createElement("h1");
  heading.textContent = "🌐 CARD Browser";

  const paragraph = document.createElement("p");
  paragraph.textContent = message;

  start.replaceChildren(heading, paragraph);
}

// KERESÉS
function renderResults() {

  const query = search.value.trim().toLowerCase();

  results.innerHTML = "";

  if (!connected || !query) {
    results.classList.add("hidden");
    return;
  }

  const matches = files.filter(file =>
    isValidHtml(file.name) &&
    file.name.toLowerCase().includes(query)
  );

  if (!matches.length) {

    const item = document.createElement("div");
    item.className = "result";
    item.textContent = "Nincs találat.";

    results.appendChild(item);

  } else {

    matches.forEach(file => {

      const item = document.createElement("div");
      item.className = "result";

      const name = document.createElement("div");
      name.textContent =
        "📄 " + file.name.replace(/\.html$/i, "");

      const hint = document.createElement("small");
      hint.textContent = file.name;

      item.append(name, hint);

      item.onclick = () => {
        openFile(file);
        results.classList.add("hidden");
      };

      results.appendChild(item);
    });
  }

  results.classList.remove("hidden");
}

search.addEventListener("input", renderResults);

search.addEventListener("keydown", event => {

  if (event.key === "Enter") {
    openFirstMatch();
  }

  if (event.key === "Escape") {
    results.classList.add("hidden");
  }
});

document.getElementById("searchBtn").onclick = openFirstMatch;

// ELSŐ TALÁLAT MEGNYITÁSA
function openFirstMatch() {

  if (!connected) return;

  const query = search.value.trim().toLowerCase();

  if (!query) return;

  const match = files.find(file =>
    file.name.toLowerCase() === query ||
    file.name.toLowerCase() === query + ".html"
  ) || files.find(file =>
    isValidHtml(file.name) &&
    file.name.toLowerCase().includes(query)
  );

  if (!match) {
    alert("Nincs találat!");
    return;
  }

  openFile(match);
}

// HTML MEGNYITÁSA
async function openFile(fileInfo) {

  if (!connected || !isValidHtml(fileInfo.name)) return;

  const existing = tabs.find(t => t.name === fileInfo.name);

  if (existing) {
    activateTab(existing.id);
    return;
  }

  try {

    const file = fileInfo.handle instanceof File
      ? fileInfo.handle
      : await fileInfo.handle.getFile();

    const html = await file.text();

    const frame = document.createElement("iframe");

    frame.setAttribute(
      "sandbox",
      "allow-scripts allow-forms allow-modals"
    );

    frame.srcdoc = html;

    const id = Date.now() + Math.random();

    content.appendChild(frame);

    tabs.push({
      id,
      name: fileInfo.name,
      title: fileInfo.name.replace(/\.html$/i, ""),
      frame
    });

    document.getElementById("start").classList.add("hidden");

    activateTab(id);

    search.value = "";
    results.classList.add("hidden");

  } catch (e) {
    alert("A megnyitás sikertelen: " + fileInfo.name);
  }
}

// FÜLEK MEGJELENÍTÉSE
function renderTabs() {

  tabsElement.innerHTML = "";

  tabs.forEach(tab => {

    const element = document.createElement("div");

    element.className =
      "tab" + (tab.id === activeTab ? " active" : "");

    const title = document.createElement("span");
    title.textContent = tab.title;

    const close = document.createElement("span");
    close.className = "close";
    close.textContent = "×";

    close.onclick = event => {
      event.stopPropagation();
      closeTab(tab.id);
    };

    element.onclick = () => activateTab(tab.id);

    element.append(title, close);
    tabsElement.appendChild(element);
  });
}

// AKTÍV LAP
function activateTab(id) {

  activeTab = id;

  tabs.forEach(tab => {
    tab.frame.classList.toggle("active", tab.id === id);
  });

  renderTabs();
}

// LAP BEZÁRÁSA
function closeTab(id) {

  const index = tabs.findIndex(tab => tab.id === id);

  if (index < 0) return;

  tabs[index].frame.remove();
  tabs.splice(index, 1);

  if (tabs.length) {
    activateTab(tabs[Math.min(index, tabs.length - 1)].id);
  } else {
    activeTab = null;
    renderTabs();
    showStart("Válassz a keresőből!");
  }
}

// ÖSSZES LAP BEZÁRÁSA
function closeAll() {

  tabs.forEach(tab => tab.frame.remove());

  tabs = [];
  activeTab = null;

  renderTabs();
}

// CSATLAKOZTATÁS
document.getElementById("connect").onclick = connectCard;

</script>

</body>
</html>
